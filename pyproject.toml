[project]
name = "job-analyzer"
version = "0.1.0"
description = "Local AI-assisted job posting analyzer and ranker"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "pydantic>=2",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_analyzer"]

[tool.uv]
# Windows Application Control blocks the unsigned binaries of the Python builds that uv
# downloads. The project uses the official python.org Python (signed by the PSF).
python-preference = "only-system"

[tool.pytest.ini_options]
testpaths = ["tests"]
